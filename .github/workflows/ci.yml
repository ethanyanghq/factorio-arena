name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job name doubles as the required status-check context for a future branch ruleset.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run yamllint .
      - run: uv run pytest
