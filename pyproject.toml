[project]
name = "factorio-arena"
version = "0.1.0"
description = "Hands-only Factorio RL environment for LLM agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "verifiers>=0.3.1",
  "factorio-rcon-py>=2.1",
  "pydantic>=2.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
# GPU box only; the base install stays light.
train = ["vllm>=0.31; sys_platform == 'linux'"]  # GPU box only; vllm has no macOS wheels and pins its own torch
track = ["wandb"]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
    "ruff>=0.16",
    "pyrefly>=1.3",
    "pre-commit>=4.6",
    "yamllint>=1.38",
]
test = ["pytest>=9", "pytest-timeout"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"
# Lock only for the platforms we run on: Linux x86 (servers, CI) and macOS arm64 (dev).
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pyrefly]
# The probes in scripts/ import each other as top-level modules; src/ is the default root.
search-path = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: needs a running Factorio server"]
# Server tests are opt-in: `pytest -m server`.
addopts = "-m 'not server'"
timeout = 60
